<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>炉火营地 · 专注中</title>
    <style>
      @font-face { font-family: "Fusion Pixel"; src: url("../assets/fonts/fusion-pixel-12px-proportional-zh-hans.woff2") format("woff2"); font-display: block; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      body { font-family: "Fusion Pixel", monospace; color: #fff0cb; text-rendering: geometricPrecision; }
      button { font: inherit; }
      .widget { width: 100%; height: 100%; padding: 4px; background: #21130d; border: 2px solid #714329; box-shadow: 0 4px 0 rgba(19, 10, 6, .44); }
      .inner { display: grid; grid-template-columns: 38px minmax(130px, 1fr) 134px 78px 24px; align-items: center; gap: 10px; height: 100%; padding: 0 13px; border: 1px solid #ad6d37; background: linear-gradient(90deg, #3a2115 0%, #2c1a11 50%, #24150e 100%); -webkit-app-region: drag; cursor: grab; }
      .inner:active { cursor: grabbing; }
      .ember { display: grid; width: 28px; height: 28px; place-items: center; color: #ffd27e; font-size: 15px; background: #4d2a17; border: 1px solid #bd7639; box-shadow: inset 0 0 0 2px #2d190f; }
      .eyebrow { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; color: #e5b067; font-size: 10px; letter-spacing: .07em; }
      .pulse { width: 6px; height: 6px; background: #ffbd56; }
      .content { overflow: hidden; color: #fff0d0; font-size: 15px; line-height: 1; letter-spacing: .025em; white-space: nowrap; text-overflow: ellipsis; }
      .timer { min-width: 0; color: #fff4d7; font-size: 28px; font-variant-numeric: tabular-nums; letter-spacing: .025em; line-height: 1; text-align: center; text-shadow: 2px 2px 0 #170d08; }
      .return, .close { margin: 0; color: #f4ce90; background: #59301a; border: 1px solid #bf773a; box-shadow: inset 0 0 0 1px #351c10, 0 2px 0 #170d08; cursor: pointer; font-size: 10px; -webkit-app-region: no-drag; }
      .return { min-height: 27px; padding: 4px 7px; }
      .return:hover { color: #fff4d8; background: #8d4b25; }
      .close { width: 23px; height: 23px; padding: 0; color: #ca9b7c; font-size: 14px; line-height: 1; }
      .close:hover { color: #fff4d8; background: #7f3824; }
      .close:active, .return:active { transform: translateY(1px); box-shadow: inset 0 0 0 1px #351c10, 0 1px 0 #170d08; }
      .widget[data-status="paused"] .pulse { background: #a9b8c5; }
      .widget[data-status="paused"] .ember { color: #b9d3df; background: #33434b; border-color: #7694a2; }
    </style>
  </head>
  <body>
    <main class="widget" data-status="running" aria-label="炉火营地专注计时">
      <div class="inner">
        <span class="ember" aria-hidden="true">◆</span>
        <div>
          <div class="eyebrow"><span class="pulse"></span>炉火营地 · <span id="state">正在专注</span></div>
          <div class="content" id="content">正在整理行囊</div>
        </div>
        <div class="timer" id="timer">00:00:00</div>
        <button class="return" id="return" type="button">回到旅途</button>
        <button class="close" id="close" type="button" aria-label="关闭置顶小窗" title="关闭置顶小窗">×</button>
      </div>
    </main>
    <script src="./focus-widget.cjs"></script>
  </body>
</html>
